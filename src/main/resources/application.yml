# Pricing & promotion simulator — default configuration (PLAN.md §3).
# Datasource values come from environment variables (or a local .env file); the defaults match docker-compose.yml.
spring:
  application:
    name: pricing-promo-simulator
  config:
    # Lets `cp .env.example .env` configure both docker compose and the app. Real env vars take precedence.
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pricingsim}?reWriteBatchedInserts=true}
    username: ${POSTGRES_USER:pricingsim}
    password: ${POSTGRES_PASSWORD:pricingsim}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.flywaydb: INFO
