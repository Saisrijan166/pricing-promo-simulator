# Pricing & promotion simulator — default configuration (PLAN.md §3).
# Datasource values come from environment variables (or a local .env file); the defaults match docker-compose.yml.
spring:
  application:
    name: pricing-promo-simulator
  config:
    # Lets `cp .env.example .env` configure both docker compose and the app. Real env vars take precedence.
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pricingsim}?reWriteBatchedInserts=true}
    username: ${POSTGRES_USER:pricingsim}
    password: ${POSTGRES_PASSWORD:pricingsim}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    generator:
      write-bigdecimal-as-plain: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.flywaydb: INFO

# Pricing engine thresholds (PLAN.md §8). Used by the generator and the simulate API alike; changing any value
# changes the generated dataset, so bump PricingPolicy.RULE_VERSION with it.
pricing:
  policy:
    freshness-hours: 72
    min-match-confidence: "0.80"
    max-step-change-pct: "0.08"
    auto-approve-max-change-pct: "0.10"
    overstock-days: 60
    low-cover-days: 7
    high-velocity-ratio: "1.2"
    overstock-adj: "-0.03"
    low-cover-adj: "0.03"
    value-offset: "-0.03"
    match-offset: 0
    premium-offset: "0.05"
    default-max-stack: 2
    default-max-combined-discount: "0.40"
    initial-target-ratio: "0.95"
    min-history-days: 7

# Synthetic data generator (PLAN.md §7.1). Every profile value can be overridden by a CLI flag
# (--seed --skus --days --promos --start-date --anomalies-per-type).
generator:
  seed: 20261022
  default-scale: starter
  # Fixed "as of" timestamp recorded with each run. The generator never reads the system clock.
  reference-ts: "2026-07-01T00:00:00Z"
  scales:
    # Unit and integration test fixtures.
    tiny:
      skus: 20
      days: 14
      promotions: 8
      start-date: "2026-01-01"
      anomalies-per-type: 1
      competitors: 3
    # Committed sample and CI: 01-01-2026 to 01-03-2026, which spans 3 cost months.
    starter:
      skus: 200
      days: 60
      promotions: 80
      start-date: "2026-01-01"
      anomalies-per-type: 5
      competitors: 3
    # Brief baseline: 5,000 SKUs x 180 days (01-01-2026 to 29-06-2026) x 2,000 promotions.
    full:
      skus: 5000
      days: 180
      promotions: 2000
      start-date: "2026-01-01"
      anomalies-per-type: 50
      competitors: 3
