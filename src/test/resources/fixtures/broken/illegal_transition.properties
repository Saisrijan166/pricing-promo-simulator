# A promotion event DRAFT -> EXPIRED (illegal, and it does not continue from the previous ACTIVE event).
# The final status still equals the last event, so only the transition check fails.
description=Illegal promotion status transition
table=promotion_status_event
action=set
where.from_status=ACTIVE
where.to_status=EXPIRED
set.from_status=DRAFT
expect.category=LIFECYCLE
expect.table=promotion_status_event
