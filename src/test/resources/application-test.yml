# Test profile: in-memory H2 in PostgreSQL mode. The same Flyway migrations run here and on Postgres.
spring:
  datasource:
    url: jdbc:h2:mem:pricingsim;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
