# PostgreSQL for the pricing & promotion simulator (PLAN.md §3, §17).
# Values come from .env (copy .env.example); the defaults match application.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricingsim}
      POSTGRES_USER: ${POSTGRES_USER:-pricingsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricingsim}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
